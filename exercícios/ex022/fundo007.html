<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #coutainer{
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            height: 95vh;
            padding: 10px;
            background-color: purple;


            position: relative;/*denominando aqui a posição relariva*/
        }
        #conteudo{
            background-image: url('imagens/target001.png');
            background-size: 100% 100%;
            height: 200px;
            width: 400px;
            background-color: yellow;

            /*denominando aqui a posição absoluta, vc poderá configurar essas propriedades, alinhando tando na vertical quanto na horizontal, centralzando as duas imagens no meio da tela */
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>

</head>
<body>
    <section id="coutainer">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
