<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Tabelas em HTML
    </title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        table {
            /*se colocarmos borda dentro da tabela, ele vai fazer somente em volta então é melhor solocar diretamente nos dados dela*/
            width: 400px;/*largura */
            border-collapse: collapse;/*espaço entre as bordas */
            
        }

        tr.linha {
            background-color: gray;
        }

        td {
            border: 1px solid black;
            padding: 8px;/*espaço dos dados */
        }

        td.dado {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela </h1>
    <!--HIERARQUITA DE TABELAS (SIMPLES) 
        TABLE - tabela 
            TABLE ROW - linha da tabela
                TABLE HEADER - cabeçalho da tabela 
                    TABLE DATA - dados da tabela -->
    <table>
        <tr><!--table row/linha da tabela -->
            <td>A1</td><!--table data/dados da tabela-->
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="linha"><!--segunda linha -->
            <td>A2</td><!--dados da tabela-->
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr><!--terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr><!--quarta linha -->
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td>B5</td>
        </tr>
        <tr>
            <td>A6</td>
        </tr>
    </table>
</body>
</html>
